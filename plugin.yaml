name: diaktoros
version: 0.1.1
description: >-
  Diaktoros — bounded, autonomous software maintenance for Hermes. Unattended PR review between
  two agents: a fixer pushes, a different reviewer returns a verdict, the budget is counted in
  verdicts, a watchdog finds silent stalls, and a finished PR gives its local disk back. Disclosure — creates webhook routes and (optionally) a
  cron job, calls the GitHub API with repo-scope tokens you provide, deletes local review
  artifacts for merged or closed PRs, and — only when a loop is given an observer feed — posts
  short read-only notices about that loop's transitions to the chat the feed names.
author: Jeremy Coe
homepage: https://github.com/coe0718/diaktoros
license: MIT
requires_hermes: ">=0.21.5"
platforms:
  # Linux only: every seat turn runs in bubblewrap (user namespaces), which macOS lacks.
  - linux
python_dependencies: []
# Settings the operator can edit in the desktop (Capabilities → Plugins → review loop). They are
# the defaults a NEW loop starts from, and what `hermes dk apply --loop <id>` pushes onto
# an existing one — a form that silently renumbered a running loop would be a nasty thing to debug.
# Mirrored by diaktoros/config.py SETTINGS_SCHEMA; the test suite asserts the two agree, because a
# form that writes keys nothing reads is worse than no form at all.
config_schema:
  cap:
    label: "Review cap (verdicts)"
    type: int
    default: 3
    description: "Verdicts before the loop stops and hands the PR to an adjudicator (cap - 1 fixes)"
  reviewer_concurrency:
    label: "Reviews at once"
    type: int
    default: 1
    description: "Reviews that may run at once; everything above this queues. Above 1 needs a clone path, so each run gets its own sandbox."
  fixer_concurrency:
    label: "Fixes at once"
    type: int
    default: 1
    description: "Fixes that may run at once; everything above this queues"
  clone:
    label: "Clone path (required above 1)"
    type: str
    default: ""
    description: "Local clone the runs isolate from — required above 1, because a parallel run in a shared checkout produces wrong verdicts"
  base:
    label: "Base branch"
    type: str
    default: "main"
    description: "Base branch the loop watches"
  grace_min:
    label: "Watchdog grace (minutes)"
    type: int
    default: 35
    description: "Minutes a quiet PR may sit before the watchdog speaks"
  ttl_min:
    label: "Seat slot TTL (minutes)"
    type: int
    default: 45
    description: "Minutes a seat slot survives — the backstop for a run that died without a verdict"
  inflight_ttl_min:
    label: "In-flight mark TTL (minutes)"
    type: int
    default: 10
    description: "Minutes an in-flight mark blocks a second run at the same head"
  turn_budget_s:
    label: "Turn budget (seconds)"
    type: int
    default: 900
    description: "Wall-clock seconds one isolated seat turn may run: Hermes's --run-budget, and the sandbox is killed shortly after. A real review builds and tests, so keep it generous (60-14400)"
  host:
    label: "Webhook host"
    type: str
    default: ""
    description: "Your gateway's public webhook origin (required to create GitHub hooks)"
  reviewer_profile:
    label: "Reviewer's Hermes profile"
    type: str
    default: ""
    description: "Profile the reviewer seat runs as. Blank = not set here: a new loop still needs one, and it must differ from the fixer's"
  fixer_profile:
    label: "Fixer's Hermes profile"
    type: str
    default: ""
    description: "Profile the fixer seat runs as. Blank = not set here: a new loop still needs one, and it must differ from the reviewer's"
  reviewer_login:
    label: "Reviewer's GitHub login"
    type: str
    default: ""
    description: "GitHub login the reviewer seat acts as — the login the review route serves. Must be in the loop's reviewers allowlist. Blank = not set here"
  fixer_login:
    label: "Fixer's GitHub login"
    type: str
    default: ""
    description: "GitHub login the fixer seat acts as. Must be in the loop's fixers allowlist. Blank = not set here"
  adjudicator_profile:
    label: "Adjudicator's Hermes profile (optional)"
    type: str
    default: ""
    description: "Profile that rules when the verdict budget is spent. Blank = not set here: a loop with no adjudicator route is left exactly as it is"
  reviewer_token_file:
    label: "Reviewer's token file (path only)"
    type: str
    default: ""
    description: "Absolute path (~ allowed) to the file holding the reviewer login's GitHub PAT — the path only, never the token itself. Must be your own mode-600 regular file. Blank = not set here"
  fixer_token_file:
    label: "Fixer's token file (path only)"
    type: str
    default: ""
    description: "Absolute path (~ allowed) to the file holding the fixer login's GitHub PAT — the path only, never the token itself. Must be your own mode-600 regular file. Blank = not set here"
  adjudicator_login:
    label: "Adjudicator's GitHub login (optional)"
    type: str
    default: ""
    description: "Optional fourth account the ruling is also posted as, as a PR comment. Must differ from the reader and both seats, with its own token file. Lands only on a loop with an adjudicator route. Blank = not set here"
  adjudicator_token_file:
    label: "Adjudicator's token file (path only, optional)"
    type: str
    default: ""
    description: "Absolute path (~ allowed) to the file holding the adjudicator login's GitHub PAT — the path only, never the token itself. Must be your own mode-600 regular file, not shared with any other login. Blank = not set here"
  reviewer_max_steps:
    label: "Reviewer's agent steps per turn"
    type: str
    default: ""
    description: "Agent steps one reviewer turn may take, 8-200. Blank = not set here: the loop keeps its own value or the role default"
  fixer_max_steps:
    label: "Fixer's agent steps per turn"
    type: str
    default: ""
    description: "Agent steps one fixer turn (and an issue fix) may take, 8-200. Blank = not set here: the loop keeps its own value or the role default"
  fix_daily_turns:
    label: "Issue-fix daily cap (turns)"
    type: str
    default: ""
    description: "Issue-fix turns per local day, 1-1000. Needs the loop's triage.fix_label. Blank = not set here: the loop keeps its own value or the default"
  review_only:
    label: "Review-only authors (comma-separated)"
    type: str
    default: ""
    description: "GitHub logins whose PRs the reviewer reviews but the fixer never touches: a changes-requested verdict goes back to the author. Not a fixer or a reviewer. Blank = not set here"
  required_checks:
    label: "Required CI checks (comma-separated)"
    type: str
    default: ""
    description: "The check runs or status contexts that gate an approval, named exactly as GitHub shows them, e.g. 'tests (3.11), lint'. Others are shown to the reviewer as optional and never block. Blank = not set here (an unset list means every check gates)"
  fixer_check:
    label: "Fixer's always-run check (command)"
    type: str
    default: ""
    description: "One command the fixer runs in the checkout before every push or issue-fix PR, besides the tests it touched: the checks CI always runs (chain several with &&). At most 500 characters, one line. Blank = not set here"
  review_after_ci:
    label: "Review after CI finishes"
    type: bool
    default: false
    description: "On: a review waits while the head's checks are still running (up to an hour), then starts with their results. Off: it starts at once, and the reviewer sees whatever CI has finished so far."
  attribution:
    label: "Sign what the loop posts"
    type: bool
    default: true
    description: "On: every review, comment and commit the loop itself posts ends with 'Automated by Diaktoros' and a link (commits get an Automated-By trailer). Off: nothing is added. Never touches what people or agents post by hand."
