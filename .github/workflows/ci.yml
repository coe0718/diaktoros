name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly and on demand, so timing flakes surface outside PR runs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # Keyed by event too, so a push to main never cancels the scheduled run (or vice versa).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a pinned image (#364): ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and the
# verticals and installed-mode jobs depend on bubblewrap and unprivileged user namespaces, which a new
# release can restrict. Move the pin in one deliberate PR, after 26.04 is tested.
env:
  # Bump deliberately with the Hermes version the loop runs on: `plugin-guard` scans the plugin with
  # this Hermes, and `installed-mode` runs the suite with it on the interpreter.
  HERMES_PINNED: be5e9f72c6681af9dfb75bf480f08844f1499949

jobs:
  # The harness. The unit suite runs in the `unit` shards below (#850); this job keeps the
  # `tests (3.x)` names that loops already list in required_checks.
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Hermes venv runs (the turns, gates and resolver); 3.14 is what Hermes
        # ships for its own CLI (`hermes dk …` runs in that process), so test both ends.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install: the plugin is stdlib-only on purpose, and so are its tests.
      - name: Compile every file
        run: python -m compileall -q diaktoros scripts __init__.py tests
      - name: Loop tests (gates, budget, seats, watchdog, cleanup)
        run: python tests/run_tests.py

  # The unit suite in three shards per Python (#850), about 3 minutes each instead of 9 in one
  # job. tests/shard.py deals every tests/test_*.py into exactly one shard, balanced by
  # tests/shard_weights.json; test_shard.py fails if a module is in no shard or in two. The shard
  # count is in the matrix and the run line below: change both together.
  unit:
    name: unit (${{ matrix.python }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The sandbox tests skip without bubblewrap; a green run must mean they ran. Ubuntu
      # restricts unprivileged user namespaces by default, which bwrap needs.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Through tests/leakguard.py: an unclosed database, file or socket, or a child left
      # running, fails the run (a ResourceWarning from a finalizer would otherwise only print).
      # -v names every test, so a skip in the log says which test and why; the loop reads these
      # lines as per-test evidence (diaktoros/ci_tests.py).
      - name: Boundary tests (broker, push, fetch, proxy, supervisor, sandbox)
        run: python tests/leakguard.py -v $(python tests/shard.py 3 ${{ matrix.shard }})
      # Scheduled runs repeat the shard: a second pass doubles the chance to catch a timing flake.
      - name: Boundary tests, second pass (scheduled only)
        if: github.event_name == 'schedule'
        run: python tests/leakguard.py $(python tests/shard.py 3 ${{ matrix.shard }})

  # Hermes blocks an install whose scan verdict is "dangerous", and --force cannot override it
  # (#37: the plugin passed every test here and still could not be installed). Scan each change
  # with the same scanner, pinned to the Hermes commit the loop is verified against; the scheduled
  # run also scans with Hermes main, so a stricter upstream scanner shows up before an update does.
  plugin-guard:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hermes: [pinned, main]
    steps:
      - name: Skip Hermes main outside the scheduled run
        if: matrix.hermes == 'main' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "Hermes main is scanned on the weekly schedule only."
      - uses: actions/checkout@v7
        if: matrix.hermes == 'pinned' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          path: plugin
      - uses: actions/checkout@v7
        if: matrix.hermes == 'pinned' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes == 'pinned' && env.HERMES_PINNED || 'main' }}
          path: hermes
          sparse-checkout: tools
          fetch-depth: 1
      - uses: actions/setup-python@v7
        if: matrix.hermes == 'pinned' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.14"
      - name: Scan the plugin as `hermes plugins install` would
        if: matrix.hermes == 'pinned' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python plugin/.github/scripts/plugin_guard.py hermes plugin

  # The catalog's admission check, run here so a submission is never its first run: the plugin
  # catalog's CI clones the pinned commit and runs `hermes plugins validate` — manifest,
  # requires_hermes, a load in isolation, declared capabilities against what register() really
  # registers, dependencies (none here) and the security scan. It runs Hermes's own reusable
  # action from a checkout at HERMES_PINNED (#268): `uses:` takes no expressions, so a local path
  # keeps the pin in one place without keeping a copy of the action's steps that could drift.
  plugin-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PINNED }}
          path: hermes
          sparse-checkout: .github/actions/plugin-validate
          fetch-depth: 1
      - name: Validate the plugin as the catalog does
        uses: ./hermes/.github/actions/plugin-validate
        with:
          path: plugin
          hermes-ref: ${{ env.HERMES_PINNED }}

  # The suite runs in two modes, and they do not agree on every check. With Hermes importable a
  # seat's model resolves for real and stored cron expressions are validated — the mode every
  # installed machine is in, and not the one a stdlib-only image hands you. Only the other mode was
  # ever run here, so the harness could call itself "a complete installation" while nine checks were
  # red on a real box. Run the same suite once with the pinned Hermes on the interpreter.
  # Two parts in parallel (#850): the harness keeps the `installed-mode` name loops already
  # require, and the resolver tests run beside it as `installed-mode (resolver)`. In one job they
  # ran one after the other, 5-7 minutes, the slowest check once `tests` was sharded.
  installed-mode:
    name: ${{ matrix.part == 'harness' && 'installed-mode' || 'installed-mode (resolver)' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [harness, resolver]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PINNED }}
          path: hermes
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Hermes itself is not installed — it builds a native extension the resolver does not need —
      # but the two packages its pinned commit declares for this interpreter are, so the lane moves
      # only when the pin moves: croniter for stored cron expressions, ruamel.yaml for a profile's
      # config.yaml. (Hermes declares both for 3.14 and above, which is why this job runs there; the
      # 3.11/3.14 standalone coverage lives in `tests`.)
      # HERMES_AGENT_SOURCE points the tests that drive Hermes's own code (the gateway's route-script
      # resolver, #105) at this checkout; DIAKTOROS_REQUIRE_HERMES_SOURCE turns their "no Hermes
      # here" skip into a failure, so that check cannot quietly vanish from this lane.
      - name: Put the pinned Hermes on the interpreter's path
        run: |
          pip install -q "croniter==6.0.0" "ruamel.yaml==0.18.16"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/hermes" >> "$GITHUB_ENV"
          echo "HERMES_AGENT_SOURCE=$GITHUB_WORKSPACE/hermes" >> "$GITHUB_ENV"
          echo "DIAKTOROS_REQUIRE_HERMES_SOURCE=1" >> "$GITHUB_ENV"
      # Fail here rather than quietly re-running the standalone mode under a different name.
      - name: Confirm the suite will run in the installed mode
        run: python -c "import hermes_cli; print('installed mode:', hermes_cli.__file__)"
      - name: Loop tests (installed mode)
        if: matrix.part == 'harness'
        run: python tests/run_tests.py
      # `discover -s tests`, not `-m unittest tests.…`: Hermes's own `tests` package is on PYTHONPATH.
      - name: Gateway resolver tests against the pinned Hermes (#105)
        if: matrix.part == 'resolver'
        run: python tests/leakguard.py discover -v -s tests -p 'test_gate_shims.py'

  # The vertical tests drive the real Hermes (pinned) inside bubblewrap against local fakes: the
  # route script, the worker, the sandboxed turn, the inference proxy and each seat wire format —
  # and, without bubblewrap, doctor's provider-extra verdicts against that Hermes's own resolver
  # (test_seat_models.HermesAgreement, #118).
  # Everywhere else they skip for want of a Hermes checkout, so a green `tests` job never ran
  # them — which is how #110 reached main. Here a missing prerequisite fails the job
  # (DIAKTOROS_REQUIRE_HERMES_SOURCE), and a final step refuses any skip in these modules.
  # No credential is involved: every endpoint and token the tests touch is a fake.
  #
  # Two parts in parallel (#850), each with the same setup: `verticals` (the route, the worker,
  # the sandboxed turn and the contained agent, about 2.5 minutes of tests) keeps the name loops
  # already require, and `verticals (seats)` runs the seat wire formats, the inference proxy and
  # doctor's resolver agreement (about 2). In one job they took 4.9 minutes, the slowest check.
  # A module added to the verticals goes in exactly one part's list.
  verticals:
    name: ${{ matrix.part == 'core' && 'verticals' || 'verticals (seats)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            modules: >-
              tests.test_route_vertical
              tests.test_turn_vertical
              tests.test_route_worker_vertical
              tests.test_contained_agent
          - part: seats
            modules: >-
              tests.test_inference_proxy
              tests.test_oauth_seats
              tests.test_seat_models.HermesAgreement
    env:
      HERMES_AGENT_SOURCE: ${{ github.workspace }}/hermes
      DIAKTOROS_REQUIRE_HERMES_SOURCE: "1"
      # The venv's interpreter must be a uv-managed CPython: the sandbox mounts the directory it
      # lives in, which must hold nothing but that runtime.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_PINNED }}
          path: hermes
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor; bwrap needs them.
      - name: Install bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Confirm bubblewrap can unshare everything
        run: |
          if ! bwrap --unshare-all --ro-bind / / true; then
            echo "::error::bwrap --unshare-all fails on this runner; the vertical tests cannot run"
            exit 1
          fi
      # The tests look for exactly ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo.
      - name: Stable Rust toolchain at the path the tests read
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          test -x "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo"
          "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo" --version
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          # Cached below instead: the action saves only after a green job, and a red vertical
          # must not cost the next run a cold dependency install.
          enable-cache: false
      - name: Point uv at a cache directory
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: uv-cache
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-verticals-${{ runner.os }}-${{ hashFiles('hermes/uv.lock', 'hermes/pm/lock.json') }}
      # Hermes's own recipe: the CPython its lock pins, then its locked dependencies plus Hermes
      # itself (editable) into hermes/venv, where the tests look for bin/hermes. The `anthropic`
      # extra is the SDK a Claude seat's native Messages provider imports; without it Hermes
      # refuses that seat's turn (and lazy installs are off inside the sandbox).
      - name: Hermes venv at the pinned commit
        run: |
          py=$(jq -r '.packages.python.version | split("+")[0]' hermes/pm/lock.json)
          echo "Hermes pins CPython $py"
          uv venv --python "$py" hermes/venv
          cd hermes && UV_PROJECT_ENVIRONMENT="$HERMES_AGENT_SOURCE/venv" uv sync --frozen --no-dev --extra anthropic
          test -x "$HERMES_AGENT_SOURCE/venv/bin/hermes"
      - uses: actions/cache/save@v6
        if: steps.uv-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      # The unit shards deliberately have no web/Hermes dependencies. Run this exact auth +
      # WebSocket acceptance with the locked Hermes venv, not setup-python's bare interpreter.
      # Versions match HERMES_PINNED's uv.lock; keep web setup confined to this lane.
      - name: Desktop socket prerequisites (pinned Hermes)
        if: matrix.part == 'core'
        run: >-
          uv pip install --python "$HERMES_AGENT_SOURCE/venv/bin/python"
          "fastapi==0.133.1" "starlette==1.3.1" "httpx==0.28.1"
      # Only query-core, pinned to the desktop lock: no Electron/frontend install.
      - uses: actions/setup-node@v6
        if: matrix.part == 'core'
        with:
          node-version: "24"
      - name: Install locked Desktop cache test dependency (no lifecycle scripts)
        if: matrix.part == 'core'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/query-core
      - name: Desktop real-TanStack component acceptance (exact count, no skips)
        if: matrix.part == 'core'
        run: python tests/run_desktop_query_core.py
      - name: Desktop read and socket acceptance (no skips)
        if: matrix.part == 'core'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          set -o pipefail
          "$HERMES_AGENT_SOURCE/venv/bin/python" tests/leakguard.py -v \
            test_desktop_events.Socket.test_real_hermes_validator_plugin_route_refusal_disconnect_reconnect \
            test_desktop_records test_desktop_reads \
            2>&1 | tee "$RUNNER_TEMP/desktop-socket.log"
          if grep -E "\.\.\. skipped|skipped=[0-9]" "$RUNNER_TEMP/desktop-socket.log"; then
            echo "::error::desktop read/socket acceptance must run, not skip"
            exit 1
          fi
          grep -q "^leak guard armed:" "$RUNNER_TEMP/desktop-socket.log"
      - name: Vertical tests (real Hermes in bubblewrap)
        # tests/ on the path too: every suite's first import is tests/_home_guard.py.
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          set -o pipefail
          python tests/leakguard.py -v ${{ matrix.modules }} 2>&1 | tee "$RUNNER_TEMP/verticals.log"
      # DIAKTOROS_REQUIRE_HERMES_SOURCE already turns the known skips into failures; this catches
      # any other skip a later change adds to these modules.
      - name: Refuse any skipped vertical test
        if: success() || failure()
        run: |
          log="$RUNNER_TEMP/verticals.log"
          test -s "$log" || { echo "::error::no vertical test output"; exit 1; }
          tail -n 3 "$log"
          if grep -E "\.\.\. skipped|skipped=[0-9]" "$log"; then
            echo "::error::vertical tests were skipped; this job exists to run them"
            exit 1
          fi
          # The verticals run through tests/leakguard.py: a run without its "armed" line was
          # unguarded, and its green would say nothing about leaks.
          grep -q "^leak guard armed:" "$log" || { echo "::error::verticals ran without the leak guard"; exit 1; }
