name: Deploy site to Pages

# The only thing that publishes coe0718.github.io/diaktoros. Pages' source must be
# "GitHub Actions" (Settings → Pages); a "Deploy from a branch" source runs GitHub's own
# Jekyll build of the repository root as well, and whichever finishes last wins.
#
# One artifact holds both halves: the docs rendered by the same Jekyll build Pages used
# (README and docs/*.md → /docs/*.html, so existing links keep working), then the launch
# page from docs/site/ laid over the root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, the newest push last: a slower older run can never land on top. A
# deploy already running finishes (cancelling one mid-publish leaves an errored deployment);
# of the runs waiting behind it only the newest is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_jekyll
      - name: Lay the launch page over the docs
        run: |
          mkdir site
          cp -R _jekyll/. site/
          cp -R docs/site/. site/
          test -f site/index.html && test -f site/poster.js && test -f site/docs/commands.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
