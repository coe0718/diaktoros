name: Deploy site to Pages

# The only thing that publishes coe0718.github.io/diaktoros. Pages' source must be
# "GitHub Actions" (Settings → Pages); a "Deploy from a branch" source runs GitHub's own
# Jekyll build of the repository root as well, and whichever finishes last wins.
#
# One artifact holds both halves: the docs rendered by the same Jekyll build Pages used
# (README and docs/*.md → /docs/*.html, so existing links keep working), then the launch
# page from docs/site/ laid over the root.
#
# The launch page's fallback figures (docs/site/data.json: release, stars, PR counts) are
# refreshed by docs/site/build-data.py at build time, into the artifact only: nothing is
# committed back. The page still prefers live GitHub figures in the browser; data.json is what it
# shows when that fetch fails. The "New in v0.x" section is hand-written prose and stays manual.

on:
  push:
    branches: [main]
  # A new release must reach data.json without a push. The github-pages environment only
  # accepts deployments from main, so a release does not build here (its ref is the tag): the
  # `redeploy` job asks for a fresh run of this workflow on main instead.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, the newest push last: a slower older run can never land on top. A
# deploy already running finishes (cancelling one mid-publish leaves an errored deployment);
# of the runs waiting behind it only the newest is kept.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # workflow_dispatch is the one event GITHUB_TOKEN may start a run with, so this needs no
  # other credential. The new run queues behind this one in the `pages` group.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy main again for the new release
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # The refresh lands in the artifact only, so the checked-in data.json can be older than
      # what the site last published. build-data.py starts from whichever of the two was pushed
      # later and writes that first, so an API failure, a timeout or a crash keeps the newest
      # published figures. Never fatal: a failed refresh must not hold the docs back.
      - name: Refresh the launch page's release and statistics snapshot
        run: |
          curl -fsS --max-time 30 "$PAGES_URL/data.json" -o "$RUNNER_TEMP/deployed-data.json" \
            || echo "::warning::no published data.json to start from"
          python3 docs/site/build-data.py --previous "$RUNNER_TEMP/deployed-data.json"
        timeout-minutes: 5
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_jekyll
      - name: Lay the launch page over the docs
        run: |
          mkdir site
          cp -R _jekyll/. site/
          cp -R docs/site/. site/
          test -f site/index.html && test -f site/poster.js && test -f site/docs/commands.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
