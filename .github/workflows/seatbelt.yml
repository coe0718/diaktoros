name: Experimental native macOS boundary

on:
  pull_request:
    paths:
      - diaktoros/seatbelt.py
      - diaktoros/native_macos.py
      - diaktoros/native_storage.py
      - diaktoros/native_lifecycle.py
      - diaktoros/native_anchor.py
      - diaktoros/native_recovery.py
      - diaktoros/run_supervisor.py
      - diaktoros/seatbelt_wire.py
      - diaktoros/broker_client.py
      - diaktoros/contained.py
      - diaktoros/trusted_turn.py
      - diaktoros/turn_layout.py
      - tests/test_seatbelt.py
      - tests/test_native_macos.py
      - tests/test_native_storage.py
      - tests/test_native_eject_stress.py
      - tests/test_native_lifecycle.py
      - tests/test_native_recovery.py
      - tests/test_native_cleanup.py
      - diaktoros/native_cleanup.py
      - tests/test_native_detach.py
      - tests/native_spawn_fixture.c
      - diaktoros/native_spawn.c
      - diaktoros/native_python_spawn.py
      - tests/test_native_python_spawn.py
      - tests/test_native_snapshot.py
      - tests/test_snapshot_secrets.py
      - tests/test_trusted_fetch.py
      - tests/test_turn_layout.py
      - tests/test_native_roles.py
      - tests/native_tester.py
      - tests/native_tester_hermes.py
      - tests/test_native_tester_hermes.py
      - tests/test_native_tester.py
      - docs/native-macos-tester.md
      - tests/native_rust_fixture.py
      - .github/workflows/seatbelt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seatbelt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tester-entrypoint:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate the tester commands on a clean Mac
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tester-evidence"
          python tests/native_tester.py preflight --output "$RUNNER_TEMP/tester-evidence/preflight"
          python tests/native_tester.py boundary --output "$RUNNER_TEMP/tester-evidence/boundary"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-tester-${{ matrix.runner }}
          path: ${{ runner.temp }}/tester-evidence
          retention-days: 14
          if-no-files-found: error

  boundary:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      DIAKTOROS_REQUIRE_SEATBELT: '1'
      DIAKTOROS_REQUIRE_NATIVE_STORAGE: '1'
      DIAKTOROS_REQUIRE_NATIVE_LIFECYCLE: '1'
      DIAKTOROS_REQUIRE_NATIVE_ROLES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Record native runtime
        run: |
          sw_vers
          uname -m
          test -x /usr/bin/sandbox-exec
          python -c 'import sys; print(sys.executable); print(sys.base_prefix)'
      - name: Exercise real Seatbelt boundary (no credentials or live services)
        run: python tests/leakguard.py discover -v -s tests -p 'test_seatbelt.py'
      - name: Exercise fixed-capacity APFS storage and cleanup
        run: python tests/leakguard.py discover -v -s tests -p 'test_native_storage.py'
      - name: Recover guarded turns after watchdog death and supervisor restart
        run: |
          python tests/leakguard.py discover -v -s tests -p 'test_native_recovery.py'
          python tests/leakguard.py discover -v -s tests -p 'test_native_cleanup.py'
      - name: Capture busy APFS ejects during bounded host-only churn
        env:
          DIAKTOROS_REQUIRE_NATIVE_EJECT_STRESS: '1'
        run: python tests/leakguard.py discover -v -s tests -p 'test_native_eject_stress.py'
      - name: Exercise pinned committed source export and path replacement
        run: |
          python tests/leakguard.py discover -v -s tests -p 'test_native_snapshot.py'
          python tests/leakguard.py discover -v -s tests -p 'test_turn_layout.py'
          python tests/leakguard.py -v test_trusted_fetch.CommittedSourceSnapshotTests
          python tests/leakguard.py -v test_snapshot_secrets.SnapshotSecretTests test_snapshot_secrets.EvalsAreNotExported test_snapshot_secrets.ExportedSnapshotProbeTests
      - name: Test watchdog cleanup and characterize remaining detached-child gap
        run: python tests/leakguard.py discover -v -s tests -p 'test_native_lifecycle.py'
      - name: Verify role-specific checkout mutation permissions
        run: python tests/leakguard.py discover -v -s tests -p 'test_native_roles.py'
      - name: Measure direct syscall and spawn-attribute detach routes
        run: |
          python tests/leakguard.py discover -v -s tests -p 'test_native_detach.py'
          python tests/leakguard.py discover -v -s tests -p 'test_native_python_spawn.py'
      - name: Startup diagnostics on failure
        if: failure()
        run: |
          /usr/bin/log show --last 2m --style compact --predicate 'eventMessage CONTAINS "deny" OR process == "sandboxd"' 2>&1 | tail -n 100
          python - <<'PY'
          from pathlib import Path
          for root in (Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')):
              for path in sorted(root.glob('*Python*'), key=lambda p: p.stat().st_mtime)[-3:]:
                  print(path.name)
                  print(path.read_text(errors='replace')[:14000])
          PY

  hermes-turn:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Prepare pinned Hermes using the tester command
        run: python tests/native_tester.py prepare-hermes --output "$RUNNER_TEMP/tester-hermes-preparation"
      - name: Real Hermes tool turn using the tester command
        run: python tests/native_tester.py hermes --prepared "$RUNNER_TEMP/tester-hermes-preparation/result.json" --output "$RUNNER_TEMP/tester-hermes-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-tester-hermes-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/tester-hermes-preparation/result.json
            ${{ runner.temp }}/tester-hermes-preparation/*.log
            ${{ runner.temp }}/tester-hermes-evidence
          retention-days: 14
          if-no-files-found: error
      - name: Native runtime denials on failure
        if: failure()
        run: /usr/bin/log show --last 2m --style compact --predicate 'eventMessage CONTAINS "deny" AND (eventMessage CONTAINS "python" OR eventMessage CONTAINS "Python" OR eventMessage CONTAINS "cargo" OR eventMessage CONTAINS "rustc" OR eventMessage CONTAINS "clang" OR eventMessage CONTAINS "ld(")' 2>&1 | tail -n 100
      - name: Identify users of retained workspace volumes
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib
          import subprocess
          info = subprocess.run(['/usr/bin/hdiutil', 'info', '-plist'],
                                capture_output=True, timeout=10, check=True)
          images = plistlib.loads(info.stdout).get('images', [])
          for root in sorted(Path('/private/tmp').glob('dk-volume-*'))[-3:]:
              mount = root / 'mount'
              if not mount.is_dir():
                  continue
              print('RETAINED WORKSPACE:', root, flush=True)
              for image in images:
                  if Path(image.get('image-path', '')).resolve() == root / 'turn.dmg':
                      print('OWNED ATTACHMENT:', image, flush=True)
              try:
                  result = subprocess.run(['/usr/sbin/lsof', '-nP', '+f', '--', str(mount)],
                                          capture_output=True, timeout=10)
                  print((result.stdout + result.stderr).decode(errors='replace')[-12000:])
              except subprocess.TimeoutExpired:
                  print('volume lsof exceeded diagnostic deadline')
          PY
