name: Prune workflow runs

# Keeps the Actions history bounded (#902): the newest runs, plus every run whose commit is an open
# PR's head or the default branch's head (the loop reads those runs' checks and logs), plus every
# run still going. Deleting a run removes its logs and artifacts with it.
on:
  schedule:
    - cron: "17 6 * * 0"          # Sundays, 06:17 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the newest runs to keep"
        default: "100"
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: prune-runs
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prune old runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep || '100' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python .github/scripts/prune_runs.py --keep "$KEEP" $([ "$DRY_RUN" = "true" ] && echo --dry-run)
