# Copy of the catalog entry for this plugin.
#
# The live entry lives in NousResearch/hermes-agent at plugin-catalog/hermes-review-loop.yaml.
# This copy is kept here so the entry and the code it points at move together: a SHA bump here is
# the reminder that the catalog PR needs the same change. `sha` below is filled in by the release
# step (it must be a full 40-character commit SHA — the loader rejects branches and short SHAs).
name: hermes-review-loop
repo: https://github.com/coe0718/hermes-review-loop
sha: 0000000000000000000000000000000000000000   # replaced with the release commit at publish time
description: >-
  Unattended GitHub pull-request review between two Hermes agents: one pushes fixes, a different one
  reviews, rounds are capped in verdicts, a watchdog reports silent stalls, and the loop never
  merges. Disclosure — runs Hermes agent turns unattended, each inside bubblewrap with terminal and
  file tools but no credentials, no network and none of your secret files; only a host-side broker
  writes to GitHub, with repo-scope tokens you provide in separate files; spawns host processes
  (bwrap, git, hermes workers); downloads PR source archives and pinned Rust crates on the host;
  creates webhook routes on your gateway and one cron watchdog job; deletes its own local review
  artifacts for merged or closed PRs. Nothing runs until you arm a loop, and fixer pushes stay off
  until you opt in. Opt-in extras — an observer that posts transition notices to the chat you name;
  issue triage that labels issues; an experimental seat that uses your own Claude subscription
  through its official client on the host (OAuth seats refresh through Hermes's own resolver). Linux
  only.
maintainer: coe0718
tier: community
category: automation
requires_hermes: '>=0.21.5'
docs_url: https://github.com/coe0718/hermes-review-loop#readme
version: "0.1.0"
platforms:
  # Linux only: every seat turn runs in bubblewrap (user namespaces), which macOS lacks.
  - linux
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
